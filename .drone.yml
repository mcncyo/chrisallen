# ============================================
# Drone CI/CD Pipeline Configuration
# ============================================
# This file defines the CI/CD pipeline for deploying the ComputerHacking101 website.
# It includes build, test, and deployment steps that run on every push to the repository.

# Pipeline Configuration
# ---------------------
# kind: Defines the type of pipeline (pipeline, cron, etc.)
# type: Specifies the pipeline execution environment (docker, exec, etc.)
# name: Human-readable name for the pipeline
kind: pipeline
type: docker
name: ChrisAllen – Deploy Hugo site (Cloudflare Pages)

# Git Clone Configuration
# ----------------------
# depth: Number of commits to fetch (0 = full history)
#   - Using 0 for full history to ensure proper versioning
#   - Consider increasing for faster clones if full history isn't needed
clone:
  depth: 0
  submodules: true

# Pipeline Steps
# --------------
# Each step runs in its own container with the specified image
# Steps are executed in the order they are defined
steps:
  # ============================================
  # 1. Build Hugo Site
  # ============================================
  # This step compiles the Hugo site into static files
  # using a custom Hugo image with extended features.
  #
  # Input: Source code from git repository
  # Output: Compiled site in /public directory
  # Dependencies: Hugo modules, npm packages
  - name: build-hugo
    # Using Ubuntu base image to build Hugo from source
    image: ubuntu:22.04
    
    # Environment variables
    environment:
      HUGO_VERSION: "0.147.6"  # Match your local version (quoted to preserve as string)
      HUGO_ENV: production
      TZ: America/Chicago
      DEBIAN_FRONTEND: noninteractive
    
    # Volume mounts for caching
    volumes:
      - name: cache_hugo
        path: /root/.cache/hugo
      - name: cache_npm
        path: /root/.npm
    
    # Commands to execute in the container
    commands:
      # Enable error handling and debugging
      - set -eux
      
      # Install dependencies
      - |
        apt-get update && apt-get install -y --no-install-recommends \
          wget \
          git \
          ca-certificates \
          build-essential \
          pkg-config \
          gcc \
          g++ \
          make \
          cmake \
          curl \
          gnupg \
          tar \
          xz-utils \
          python3 \
        && rm -rf /var/lib/apt/lists/*
      
      # Display environment info
      - echo "Starting build setup..."
      - echo "Building with the following content files:"
      - find content -type f -name "*.md" | wc -l
      - echo "Initializing git submodules (themes, etc.)..."
      - git submodule update --init --recursive || true
      - git config --global --add safe.directory /drone/src || true
      - git config --global user.email "ci@local" || true
      - git config --global user.name "Drone CI" || true
      - echo "Theme directory contents:" && ls -la themes || true
      
      # Install Node.js and npm
      - curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
      - apt-get install -y nodejs
      
      # Install npm dependencies if package.json exists
      - test -f package.json && (npm ci || npm install) || true
      - export PATH="$PATH:$(pwd)/node_modules/.bin"
      
      # Install Hugo extended binary (hardcoded v0.147.6)
      - |
        set -eux
        echo 'Downloading Hugo v0.147.6...'
        curl -fL -o /tmp/hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v0.147.6/hugo_extended_0.147.6_Linux-64bit.tar.gz
        tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
        /usr/local/bin/hugo version
      - echo "Count of draft posts:" && /usr/local/bin/hugo list drafts | wc -l || true
      - echo "Count of future posts:" && /usr/local/bin/hugo list future | wc -l || true
      - echo "Count of expired posts:" && /usr/local/bin/hugo list expired | wc -l || true
      
      # Show Hugo configuration and environment
      - /usr/local/bin/hugo config | sed -n '1,200p' || true
      
      # List all content files
      - echo "Content files to be built:"
      - find content -type f -name "*.md" | sort
      
      # Show layouts present
      - echo "Root layouts directory:" && ls -la layouts || true
      - echo "Theme layouts directory:" && ls -la themes/gokarna/layouts || true
      
      # Build the Hugo site with verbose output
      - |
        set -x
        /usr/local/bin/hugo \
          --minify \
          --gc \
          --enableGitInfo \
          --environment production \
          --cleanDestinationDir \
          --ignoreCache \
          --buildDrafts=true \
          --buildFuture=true \
          --buildExpired=true \
          --baseURL "https://chrisallen.us/" \
          --templateMetrics \
          --templateMetricsHints \
          --printPathWarnings \
          --printI18nWarnings \
          --logLevel info
      
      # Verify build output
      - echo "Number of HTML files generated:"
      - find public -type f -name "*.html" | wc -l
      
      # List all generated files for debugging
      - find public -type f | sort

  # ============================================
  # 2. Verify Sitemap
  # ============================================
  # Validates that the sitemap was generated correctly
  # and contains the expected content.
  #
  # Input: Generated sitemap.xml in /public
  # Output: Debug information in logs
  - name: verify-sitemap
    # Lightweight Alpine image for basic shell commands
    image: alpine:3.20
    
    # Run this step on all pushes and tags
    when:
      event: [push, tag]
    
    commands:
      # Enable error handling and debugging
      - set -euxo pipefail
      
      # Verify sitemap exists
      - test -f public/sitemap.xml
      
      # Count number of URLs in sitemap
      - grep -c "<url>" public/sitemap.xml || true

      
      # Print first 80 lines of sitemap for debugging
      - sed -n '1,80p' public/sitemap.xml

  # ============================================
  # 3. Deploy to Cloudflare Pages
  # ============================================
  # Deploys the built site to Cloudflare Pages
  # using Wrangler CLI.
  #
  # Input: Compiled site in /public
  # Output: Deployed site on Cloudflare Pages
  - name: deploy-pages
    # Node.js image with npm for Wrangler
    image: node:20-alpine
    
    # Run on all pushes and tags
    when:
      event: [push, tag]
    
    # Cloudflare API credentials
    environment:
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: CF_ACCOUNT_ID  # Cloudflare account ID for chrisallen.us
      CLOUDFLARE_API_TOKEN:
        from_secret: CLOUDFLARE_API_TOKEN  # Cloudflare API token with Pages edit permission for chrisallen.us
    
    commands:
      # Enable error handling and debugging
      - set -eux
      
      # Install timezone data (required by some dependencies)
      - apk add --no-cache tzdata
      
      # Install Wrangler CLI globally
      - npm i -g wrangler@3
      
      # Deploy to Cloudflare Pages
      - |
        # Check if this is the main branch
        if [ "$DRONE_BRANCH" = "main" ]; then
          # Production deployment (no branch specified)
          wrangler pages deploy public --project-name=chrisallen
        else
          # Preview deployment with branch name
          wrangler pages deploy public --project-name=chrisallen --branch="$DRONE_BRANCH"
        fi

  # ============================================
  # 4. Cloudflare Cache Purge
  # ============================================
  # Purges the Cloudflare cache for specific URLs
  # to ensure visitors see the latest content.
  #
  # Input: List of URLs to purge
  # Output: Cache purge status
  - name: purge-cf-cache
    # Lightweight image with curl
    image: alpine/curl:8.9.1
    
    # Only run on main branch pushes and tags
    when:
      event: [push, tag]
      branch: [main]
    
    # Cloudflare API credentials
    environment:
      CLOUDFLARE_API_TOKEN: { from_secret: CLOUDFLARE_API_TOKEN_PURGE }  # Token with zone.cache_purge permission for chrisallen.us
      CF_ZONE_ID: { from_secret: CF_ZONE_ID }  # Cloudflare Zone ID for chrisallen.us
    
    commands:
      # Make the purge script executable
      - chmod +x .drone/scripts/purge-cf-cache.sh
      
      # Install jq for JSON pretty-printing (used in the script)
      - apk add --no-cache jq
      
      # Execute the cache purge script
      - .drone/scripts/purge-cf-cache.sh

  # ============================================
  # 5. Submit Sitemap to Search Engines (IndexNow)
  # ============================================
  # Informs search engines about the updated sitemap
  # using the IndexNow protocol.
  #
  # Input: sitemap.xml
  # Output: Submission status to search engines
  - name: indexnow-submit
    # Python image for running the IndexNow script
    image: python:3.11-alpine
    
    # Only run on main branch pushes and tags
    when:
      event: [push, tag]
      branch: [main]
    
    # IndexNow API key
    environment:
      INDEXNOW_KEY:
        from_secret: INDEXNOW_KEY  # Secret key for IndexNow API
    
    commands:
      # Enable error handling and debugging
      - set -eux
      
      # Install required Python packages
      - pip install --no-cache-dir requests defusedxml
      
      # Make the IndexNow script executable
      - chmod +x .drone/scripts/indexnow.py
      
      # Ensure the key file is in the root of the public directory
      - cp static/51ccd95176a34334891dc90cab8d3dc7.txt public/
      # Run the IndexNow submission script with the correct key file and host
      - SITE_HOST=chrisallen.us INDEXNOW_KEY=51ccd95176a34334891dc90cab8d3dc7 .drone/scripts/indexnow.py

  # ============================================
  # 6. Warm Cache
  # ============================================
  # Visits important pages to warm up the cache
  # and improve initial page load times.
  #
  # Input: List of URLs to warm
  # Output: Cache warming status
  - name: warm-cache
    # Lightweight image with curl
    image: alpine/curl:8.9.1
    
    # Only run on main branch pushes and tags
    when:
      event: [push, tag]
      branch: [main]
    
    commands:
      # Enable error handling and debugging
      - set -eux
      
      # Make the warm cache script executable
      - chmod +x .drone/scripts/warm_cache.sh
      
      # Execute the warm cache script with parameters:
      # 1. Sitemap URL
      # 2. Space-separated list of additional URLs to warm
      - |
        .drone/scripts/warm_cache.sh \
          "https://chrisallen.us/sitemap.xml" \
          "https://chrisallen.us/ https://www.chrisallen.us/"

# ============================================
# Volumes
# ============================================
# Volumes are used to persist data between steps
# and speed up builds by caching dependencies.
volumes:
  # Hugo build cache
  - name: cache_hugo
    temp: {}  # Temporary volume (deleted after pipeline completes)
  
  # npm package cache
  - name: cache_npm
    temp: {}  # Temporary volume (deleted after pipeline completes)

# ============================================
# Pipeline Triggers
# ============================================
# Defines when the pipeline should be executed.
trigger:
  # Only run on these branches
  branch: [main]
  
  # Only run on these events
  event: [push, tag]
