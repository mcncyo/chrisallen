kind: pipeline
type: docker
name: build-and-deploy

clone:
  disable: false

steps:
# - name: install npm dependencies
#   image: node:18-alpine
#   commands:
#     - npm install

  - name: hugo build
    image: klakegg/hugo:ext-alpine
    commands:
      - hugo --minify

  - name: deploy via sync
    image: appleboy/drone-scp
    settings:
      host: server1.chrisallen.us
      username: mcncyo
      port: 22
      key:
        from_secret: webserverkey
      source: public/
      target: /home/mcncyo/websites/chrisallen/


