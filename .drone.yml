kind: pipeline
type: docker
name: build-and-deploy

steps:
  - name: git submodules
    image: alpine/git
    commands:
      - git submodule update --init --recursive

  - name: hugo build
    image: klakegg/hugo:ext-alpine
    commands:
      - umask 0022
      - hugo --minify --baseURL "https://chrisallen.us/"
      - ls -lh public
      - ls -lh public/index.html || echo "index.html missing"

# Uncomment the one you want!

# One-time full update:
  - name: extract all URLs
    image: python:3.11-alpine
    commands:
      - python .drone/scripts/extract_all_urls.py

# Normal incremental updates:
#  - name: extract changed URLs
#    image: python:3.11-alpine
#    environment:
#      CHANGE_WINDOW_HOURS: 24
#    commands:
 #     - python .drone/scripts/extract_changed_urls.py

  - name: show changed URLs
    image: alpine
    commands:
      - |
        if [ -s changed_urls.txt ]; then
          echo "Changed URLs found:"
          cat changed_urls.txt
        else
          echo "No changed URLs found."
        fi

  - name: deploy via rsync
    image: appleboy/drone-scp
    settings:
      host: server1.chrisallen.us
      username: mcncyo
      port: 22
      key:
        from_secret: webserverkey
      source: public/
      target: /srv/www/chrisallen
      rsync: true
      rm: true
      strip_components: 1
      rsync_args:
        - --delete

  - name: fix permissions on server
    image: appleboy/drone-ssh
    settings:
      host: server1.chrisallen.us
      username: mcncyo
      port: 22
      key:
        from_secret: webserverkey
      script:
        - chmod -R o+rx /srv/www/chrisallen

  - name: submit sitemap to IndexNow
    image: python:3.11-alpine
    environment:
    INDEXNOW_KEY:
      from_secret: INDEXNOW_KEY
    commands:
    - |
      pip install --no-cache-dir requests

      python <<'PY'
      import json, os, pathlib, requests

      # Read changed URLs file
      p = pathlib.Path("changed_urls.txt")
      if p.exists() and p.stat().st_size > 0:
          urls = [line.strip() for line in p.read_text().splitlines() if line.strip()]
      else:
          urls = []

      payload = {
          "host": "chrisallen.us",
          "key": os.environ.get("INDEXNOW_KEY", ""),
          "keyLocation": f"https://chrisallen.us/{os.environ.get('INDEXNOW_KEY', '')}.txt",
          "urlList": urls
      }

      print("Payload:")
      print(json.dumps(payload, indent=2))

      if urls:
          resp = requests.post(
              "https://api.indexnow.org/indexnow",
              json=payload,
              headers={"Content-Type": "application/json"},
              timeout=30
          )
          print("IndexNow Response:")
          print(resp.status_code, resp.text)
      else:
          print("No URLs to submit.")
      PY


  - name: purge Cloudflare cache
    image: alpine:latest
    environment:
      CF_ZONE_ID:
        from_secret: CF_ZONE_ID
      CF_API_TOKEN:
        from_secret: CF_API_TOKEN
    commands:
      - apk add --no-cache curl
      - |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "ERROR: Cloudflare secrets missing!"
            exit 1
          fi

          echo "Zone ID: $CF_ZONE_ID"
          echo "Token length: ${#CF_API_TOKEN}"

          if [ -s changed_urls.txt ]; then
            URLS=$(awk NF changed_urls.txt | sed 's/^/"/;s/$/"/' | paste -sd "," -)
            JSON="{\"files\":[${URLS}]}"
            echo "Cloudflare JSON payload:"
            echo "${JSON}"

            curl -v -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "${JSON}"
          else
            echo "No changed URLs to purge."
          fi


