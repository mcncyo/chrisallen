kind: pipeline
type: docker
name: build-and-deploy

steps:
  - name: git submodules
    image: alpine/git
    commands:
      - git submodule update --init --recursive

  - name: hugo build
    image: klakegg/hugo:ext-alpine
    commands:
      - umask 0022
      - hugo --minify --baseURL "https://chrisallen.us/"
      - ls -lh public
      - ls -lh public/index.html || echo "index.html missing"

  - name: extract changed URLs
    image: python:3.11-alpine
    environment:
      CHANGE_WINDOW_HOURS: 24
    commands:
      - |
        python <<'PY'
        import os, datetime as dt, xml.etree.ElementTree as ET, pathlib, sys
        cutoff = dt.datetime.utcnow() - dt.timedelta(hours=int(os.getenv('CHANGE_WINDOW_HOURS', '24')))
        ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
        sitemap = pathlib.Path('public/sitemap.xml')
        if not sitemap.exists():
            print('No sitemap.xml found'); sys.exit(0)
        urls = []
        for url in ET.parse(sitemap).getroot().findall('sm:url', ns):
            lm = url.find('sm:lastmod', ns)
            if lm is None: continue
            try:
                ts = dt.datetime.fromisoformat(lm.text.replace('Z', '+00:00')).replace(tzinfo=None)
            except ValueError: continue
            if ts >= cutoff:
                urls.append(url.find('sm:loc', ns).text)
        with open('changed_urls.txt', 'w') as f:
            f.write('\n'.join(urls))
        PY

  - name: show changed URLs
    image: alpine
    commands:
      - |
        if [ -s changed_urls.txt ]; then
          echo "Changed URLs found:"
          cat changed_urls.txt
        else
          echo "No changed URLs found."
        fi

  - name: deploy via rsync
    image: appleboy/drone-scp
    settings:
      host: server1.chrisallen.us
      username: mcncyo
      port: 22
      key:
        from_secret: webserverkey
      source: public/
      target: /srv/www/chrisallen
      rsync: true
      rm: true
      strip_components: 1
      rsync_args:
        - --delete

  - name: fix permissions on server
    image: appleboy/drone-ssh
    settings:
      host: server1.chrisallen.us
      username: mcncyo
      port: 22
      key:
        from_secret: webserverkey
      script:
        - chmod -R o+rx /srv/www/chrisallen

  - name: submit sitemap to IndexNow
    image: curlimages/curl:latest
    environment:
      INDEXNOW_KEY:
        from_secret: INDEXNOW_KEY
    commands:
      - |
        if [ -s changed_urls.txt ]; then
          URLS=$(cat changed_urls.txt | jq -R . | jq -s .)
        else
          URLS="[]"
        fi

        cat <<EOF > payload.json
        {
          "host": "chrisallen.us",
          "key": "${INDEXNOW_KEY}",
          "keyLocation": "https://chrisallen.us/${INDEXNOW_KEY}.txt",
          "urlList": $URLS
        }
        EOF

        curl -s -X POST "https://api.indexnow.org/indexnow" \
          -H "Content-Type: application/json" \
          --data-binary @payload.json

  - name: purge Cloudflare cache
    image: curlimages/curl:latest
    environment:
      CF_ZONE_ID:
        from_secret: CF_ZONE_ID
      CF_API_TOKEN:
        from_secret: CF_API_TOKEN
    commands:
      - |
        if [ -s changed_urls.txt ]; then
          JSON=$(jq -Rs '{files: split("\n") | map(select(length > 0))}' < changed_urls.txt)
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${JSON}"
        else
          echo "No changed URLs to purge."
        fi



